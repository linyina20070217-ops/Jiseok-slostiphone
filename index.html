<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.phone{position:relative;width:100%;height:100%;background:#fff;color:var(--ink);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;transition:background .3s}

.phone[data-sb=dark]{--sb:#111}
#sb{position:absolute;top:0;left:0;right:0;height:46px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;color:var(--sb);font-weight:600;font-size:15px;pointer-events:none;transition:color .3s}

{id:'n6',title:'🔒 给哥',date:'10月12日',locked:'0626',body:`（没有发出去的）\n\n今天休息室里 哥靠在亨準肩上睡着了\n我装作没看到 把外套递给了周演\n\n我是不是没有资格难过\n\n哥不知道\n每次听到“智硕啊” 我都要先深呼吸一次\n\n我想搬走\n这样就不用每天确认 哥对谁笑 对谁好\n\n也因为 再待下去\n我可能会说出来\n\n说出来之后呢\n团体怎么办 回归怎么办 哥怎么办\n\n先搬走\n等回归结束\n等我想好`},
{id:'n7',title:'凌晨三点的念头',date:'10月16日 03:40',body:`他今天又问我了\n“智硕啊 你是不是在躲我”\n\n我笑着说没有\n笑得脸都僵了\n\n其实我只是怕\n怕再靠近一点\n我就会把所有话都说出来\n\n说出来之后呢\n他会怎么看我\n\n算了 不想了`},
{id:'n8',title:'🔒 真正的原因',date:'10月10日 02:15',locked:'0626',body:`我决定搬走了。\n\n不是因为讨厌他。\n\n是因为我发现自己越来越不对劲。\n\n他开始跟别的成员亲近 我会难受。\n他一天不跟我说话 我会胡思乱想。\n他叫我“智硕啊” 的时候 我心跳会加速。\n\n这不是正常的 队友之间的关系。\n\n上周 我梦见他了。\n醒来之后 我坐在床上 发了很久的呆。\n\n我知道这是什么。\n\n所以我必须搬走。\n\n离他远一点。\n等回归结束。\n等这份心情冷掉。\n\n不然我怕有一天 我会说出来。\n\n说出来之后 团体怎么办。\n回归怎么办。\n他怎么办。\n\n他大概会很困扰吧。\n\n所以 搬走。\n\n这是我唯一能想到的办法。`},
{id:'n9',title:'赵科长谈话记录',date:'10月11日',body:`赵科长：你确定要申请换宿舍？回归前一周，这个时间点不太合适。\n\n我：确定。\n\n赵科长：原因呢？公司需要理由。\n\n我：个人状态管理。需要独立空间。\n\n赵科长：（看了我很久）智硕啊，你最近是不是压力太大了。\n\n我：没有。就是想要个安静的地方。\n\n赵科长：……好吧。我帮你走流程。但是回归期间，状态不能出问题。\n\n我：我知道。\n\n赵科长：还有，Halcyon 那边又联系我了。你个人的事我不干涉，但你自己想清楚。\n\n我：谢谢科长。`},

async function live(){
 if(S.busy)return;
 const c=chat(S.cr);
 if(!c||!c.live||S.li[c.id]>=c.live.length){toast('这里暂时没有新消息了');return;}
 S.busy=true;updHint();
 const batch=c.live[S.li[c.id]++];
 S.liveCount++;
 let lastW=(batch.find(x=>!x.ms)||['js'])[0];
 for(const it of batch){
  if(it.ms){await typing(it.ms,lastW,c);continue;}
  await sleep(450);
  pushMsg(c,{w:it[0],t:it[1],x:it[2],k:it[3]||''});
  lastW=it[0];
 }
 S.busy=false;
 updHint();

async function sendMsg(v){
 const c=chat(S.cr);
 if(!c||S.busy)return;
 S.busy=true;
 pushMsg(c,{w:'me',t:fmt(S.clock),x:v});
 const sus=v.length>16||/[您请先生]|\.{3,}|[A-Za-z]{7,}|[?？]{2,}/.test(v);
 const pool=sus?(c.sus||c.rxs):(c.ok||c.rx);
 await sleep(900);
 const who=c.group?null:c.id;
 const items=sus?pool.slice(0,c.group?2:1):[pick(pool)];
 for(const it of items){
  const w=Array.isArray(it)?it[0]:(who||'js');
  const x=Array.isArray(it)?it[1]:it;
  await typing(1100,w,c);
  pushMsg(c,{w,t:fmt(S.clock),x});
 }
 S.busy=false;
 updHint();
 renderChoices();
}

}

/* ============================================================
   日历
   ============================================================ */
function calApp(){
 setSB('dark');$('#phone').className='phone cal';
 const y=S.calY,m=S.calM;
 const first=new Date(y,m,1).getDay();
 const days=new Date(y,m+1,0).getDate();
 const cells=[];
 for(let i=0;i<first;i++)cells.push('<span></span>');
 for(let d=1;d<=days;d++){
  const k=`${y}-${pad(m+1)}-${pad(d)}`;
  cells.push(`<span class="d ${k===S.calSel?'sel':''} ${k==='2026-10-17'?'today':''}" data-a="cday" data-v="${k}">${d}${EVENTS[k]?'<i></i>':''}</span>`);
 }
 const evs=EVENTS[S.calSel]||[];
 sc().innerHTML=`${bar(y+'年'+(m+1)+'月','home','<span data-a="cprev">‹</span> <span data-a="cnext">›</span>')}<div class="pbody"><div class="cg">${['日','一','二','三','四','五','六'].map(w=>`<small>${w}</small>`).join('')}${cells.join('')}</div><div class="cev"><h3>${S.calSel}</h3>${evs.length?evs.map(e=>`<div class="ce"><b>${e[0]}</b><span>${esc(e[1])}</span></div>`).join(''):'<p class="mut">没有日程</p>'}</div></div>`;
}

/* ============================================================
   事件表
   ============================================================ */
const A={
 pinpage:()=>pinPage(),
 pk:v=>pinKey(v),
 pdel:()=>{pinBuf=pinBuf.slice(0,-1);[...document.querySelectorAll('#dots i')].forEach((e,i)=>e.classList.toggle('f',i<pinBuf.length));},
 lock:()=>lockScreen(),
 home:()=>{
  if(S.call){S.call=null;}
  const inc=document.getElementById('inc');if(inc)inc.remove();
  home();
 },
 open:v=>open(v),
 kakao:()=>kakaoList(),
 chat:v=>chatPage(v),
 live:()=>live(),
 choice:v=>handleChoice(v),
 ptab:v=>phoneApp(v),
 call:v=>{startCall(v);},
 cend:()=>endCall(true),
 cadd:()=>{S.call=null;phoneApp('con');},
 cfx:v=>toast(v+' 已切换'),
 kdial:v=>{
  kbuf+=v;
  const kd=$('#kd');if(kd)kd.textContent=kbuf;
  if(kbuf==='0626'&&fired('call_bday')){
   kbuf='';if(kd)kd.innerHTML='&nbsp;';
   toast('拨通了金正洙的电话');
   startCall('js',true,[[500,'js','어？智硕啊？'],[2000,'js','你怎么突然打来了……'],[2400,'js','我还以为你不想理我了。'],[2000,'js','你吃饭了吗？']]);
  }
 },
 kcall:()=>{
  if(!kbuf){toast('请输入号码');return;}
  if(kbuf==='0626'){kbuf='';startCall('js',true);return;}
  toast('这个号码不在通讯录里');
  kbuf='';const kd=$('#kd');if(kd)kd.innerHTML='&nbsp;';
 },
 vm:()=>{
  const v=$('#vmx');if(!v)return;
  v.classList.toggle('show');
  v.innerHTML='<p>“……智硕啊。你应该睡了。我只是想说…算了。明天见。”<br><small>语音信箱转文字 · 正洙</small></p>';
  if(fired('vm')){S.incKey='vm';TRIGGERS.call_vm=1;setTimeout(()=>incoming('js','vm'),3000);}
 },
 note:v=>noteOpen(v),
 notes:()=>notesApp(),
 nk:(v,el)=>noteKey(v,el.dataset.n),
 swig:()=>{S.ign=S.ign==='main'?'alt':'main';S.igTab='home';igApp();toast('已切换到 '+(S.ign==='alt'?IGALT.u:IGMAIN.u));},
 igt:v=>{S.igTab=v;igApp();},
 like:v=>{S.liked[v]=!S.liked[v];igApp();},
 dm:v=>{S.dm=+v;S.igTab='dmv';igApp();},
 story:()=>storyView(),
 sclose:()=>{const el=$('.sov');if(el)el.remove();},
 xtab:v=>xApp(v),
 xlike:v=>{S.liked['x'+v]=!S.liked['x'+v];xApp('tl');},
 xpost:v=>{
  if(!S.xBombTriggered){
   S.xBombTriggered=true;
   toast('你盯着那条帖子看了很久');
   setTimeout(()=>{
    const js=chat('js');
    pushMsg(js,{w:'js',t:fmt(S.clock),x:'你别看那些帖子了。'});
    pushMsg(js,{w:'js',t:fmt(S.clock),x:'他们说什么都不重要。'});
    pushMsg(js,{w:'js',t:fmt(S.clock),x:'我只想知道 你怎么想。'});
    pushMsg(js,{w:'js',t:fmt(S.clock),x:'……算了 你不想说就不说。'});
    toast('金正洙发来了消息');
    TRIGGERS.call_x=1;
   },800);
  }
 },
 photos:()=>photosApp(),
 photo:v=>photoView(+v),
 video:v=>{const idx=PHOTOS.findIndex(p=>p[0].includes(v));if(idx>=0)photoView(idx);},
 mail:()=>mailApp(),
 mailv:v=>mailView(+v),
 cday:v=>{S.calSel=v;calApp();},
 cprev:()=>{S.calM--;if(S.calM<0){S.calM=11;S.calY--;}calApp();},
 cnext:()=>{S.calM++;if(S.calM>11){S.calM=0;S.calY++;}calApp();},
 play:v=>{
  const t=TRACKS[v];if(!t)return;
  S.playing={name:t[0],link:t[3]};
  const mi=$('#mini');
  if(mi)mi.innerHTML=S.playing.link?`正在播放：${esc(t[0])} <a href="${t[3]}" target="_blank">前往播放页</a>`:'▶︎ '+t[0];
  if(t[0].includes('窗边的人')&&fired('privateDemo'))toast('这首是正洙的私人 demo · 仅自己可见');
 },
 idecline:()=>{
  const inc=$('#inc');if(inc)inc.remove();
  const reactions=REJECT_REACTIONS[S.rejectIndex%REJECT_REACTIONS.length];
  S.rejectIndex++;
  if((S.incKey==='confession'||S.incKey==='vm')&&!S.confessionRejected){
   S.confessionRejected=true;
   chatPage('js');
   setTimeout(()=>{pushMsg(chat('js'),{w:'js',t:fmt(S.clock),x:'我就知道你会挂。'});},1500);
   setTimeout(()=>{pushMsg(chat('js'),{w:'js',t:fmt(S.clock),x:'但你连一句让我滚的话都不肯说，是不是太残忍了。'});},5000);
   setTimeout(()=>{pushMsg(chat('js'),{w:'js',t:fmt(S.clock),x:'我现在在你工作室门口。'});},8000);
   setTimeout(()=>{pushMsg(chat('js'),{w:'js',t:fmt(S.clock),x:'把门打开。'});},11000);
   setTimeout(()=>{pushMsg(chat('js'),{w:'js',t:fmt(S.clock),x:'你今天如果不出来把话说清楚，我就在这站一晚上。'});},15000);
   setTimeout(()=>{startBomb();},16000);
  }else{
   RECENTS.unshift({id:'js',dir:'miss',t:fmt(S.clock),n:1});
   S.missed++;
   chatPage('js');
   let delay=1000;
   reactions.forEach(([w,x])=>{
    setTimeout(()=>{pushMsg(chat('js'),{w,t:fmt(S.clock),x});},delay);
    delay+=2200;
   });
  }
 },
 iaccept:()=>{
  const key=S.incKey||'confession';
  const inc=$('#inc');if(inc)inc.remove();
  if((key==='confession'||key==='vm')&&!S.confessionAccepted){
   S.confessionAccepted=true;
   startCall('js',true,JS_CONFESSION);
  }else{
   startCall('js',true,JS_CALLS[key]||JS_CALL);
  }
 }
};
/* ============================================================
   全局点击
   ============================================================ */
document.addEventListener('click',e=>{
 const homeBar=e.target.closest('.bar-home');
 if(homeBar){
  if(S.unlocked&&!S.call)home();
  else if(!S.unlocked)lockScreen();
  else if(S.call){S.call=null;phoneApp('rec');}
  return;
 }
 const el=e.target.closest('[data-a]');
 if(!el)return;
 const f=A[el.dataset.a];
 if(f)f(el.dataset.v,el);
});
/* ============================================================
   启动
   ============================================================ */
lockScreen();
tickUI();
</script>
